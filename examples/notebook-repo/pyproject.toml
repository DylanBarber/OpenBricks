[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbricks-notebook-demo"
version = "0.1.0"
description = "A self-contained bronze, silver, and gold notebook pipeline for OpenBricks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbricks_demo = ["fixtures/*.csv"]
