#   - id: charges-idempotent-for-24h
#     status: supported
#     claim: Payments treats a repeated Idempotency-Key as the same charge for
#       24 hours. Beyond that it is a new charge.
#     reason: The contract guarantees it for that window, and a run inside the
#       window agreed. The 24-hour boundary itself is untested.
#     verification: Read the provider's API reference for POST /charges, then
#       sent the same key twice 10 minutes apart and got the first charge id
#       back both times.
#     source: the provider's API reference for POST /charges; runs/idempotency-001
#     updated_at: "2026-11-06"
assumptions:
  - id: oidc-core-code-flow
    status: supported
    claim: An authorization code is bound to the client, exact callback URI, browser challenge and PKCE verifier; the ID token carries the requested nonce.
    reason: The local stateful mock validates the actual form request and issues signed tokens only for its saved one-use authorization code.
    verification: scripts/v5-oidc-simulation-check.py passed two real HTTP logins and rejected bad nonce, signature, audience, expiry, removed groups and a provider 500; its request counters and simulation request log showed discovery, authorization, token and JWKS traffic.
    source: https://openid.net/specs/openid-connect-core-1_0.html; postman/contracts/oidc-provider.openapi.yaml; scripts/v5-oidc-simulation-check.py
    updated_at: '2026-11-06'
  - id: signing-key-rotation
    status: supported
    claim: A new signing key ID causes one bounded JWKS refresh and a valid new login succeeds.
    reason: The stateful mock rotated its ephemeral in-memory RSA key after the client's first successful login.
    verification: The checker passed the final login; GET /jwks was observed twice across eight token exchanges.
    source: backend/openbricks/oidc.py; scripts/v5-oidc-simulation-check.py
    updated_at: '2026-11-06'
  - id: vendor-deployment-compatibility
    status: unknown
    claim: A particular live Entra, Keycloak or other provider deployment has the same configured claims, endpoints and client authentication policy.
    reason: No external provider credentials or selected live tenant were supplied. This simulation models the protocol, not a vendor tenant.
    verification: Owner-workspace mock search was skipped because the Postman CLI was signed out. No Postman cloud resources were published. Live tenant configuration still requires its own sign-in test.
    source: docs/IDENTITY_AND_SECRETS.md
    updated_at: '2026-11-06'

