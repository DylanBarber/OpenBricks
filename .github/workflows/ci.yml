name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: compute
          load: true
          tags: openbricks-compute:test
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=compute
          cache-to: type=gha,mode=max,scope=compute
      - name: Backend and real Spark/Delta checks
        run: docker run --rm --memory=4g --memory-swap=4g -e SPARK_MASTER=local[2] -e SPARK_DRIVER_MEMORY=1g -e OPENBRICKS_TEST_SPARK=1 openbricks-compute:test python -m pytest -q tests
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  sqlserver:
    name: SQL Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: compute
          load: true
          tags: openbricks-compute:test
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=compute
          cache-to: type=gha,mode=max,scope=compute-sql
      - name: Configure disposable SQL Server credential
        run: |
          test_password="Sql$(openssl rand -hex 20)!"
          echo "::add-mask::$test_password"
          echo "OPENBRICKS_SQLSERVER_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - name: Real ODBC, JDBC, and change-tracking checks
        run: docker compose -f compose.sql-tests.yaml up --abort-on-container-exit --exit-code-from tests --no-build
      - name: Remove disposable SQL Server resources
        if: always()
        env:
          OPENBRICKS_SQLSERVER_PASSWORD: cleanup-only-unused-password
        run: docker compose -f compose.sql-tests.yaml down --volumes --remove-orphans
  cli:
    name: CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./cli build
      - run: openbricks --version
      - name: Pack the example project without a server
        run: openbricks pack examples/deployable-project/openbricks.yml --output /tmp/openbricks-example.json
      - run: python -m build --wheel cli
  system:
    name: Full disposable system smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./cli pytest==8.3.5
      - name: Smoke runner isolation and watcher checks
        run: python -m pytest -q tests/test_system_smoke_runner.py tests/test_release_workflow.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: compute
          load: true
          tags: openbricks-compute:system
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=compute
          cache-to: type=gha,mode=max,scope=compute-system
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: openbricks:system
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: |
            type=gha,scope=compute-system
            type=gha,scope=runtime-system
          cache-to: type=gha,mode=max,scope=runtime-system
      - name: Real platform, SQL Server, restart and fresh-host recovery proof
        run: python scripts/run-system-smoke.py --runtime-image openbricks:system --compute-image openbricks-compute:system
      - name: Ensure disposable resources are removed
        if: always()
        run: docker compose --project-name openbricks-smoke --file compose.smoke.yaml --env-file docker/smoke.env.example --profile '*' down --volumes --remove-orphans --timeout 30
      # Detailed receipts include generated credentials and recovery archives.
      # They remain private to this job and must never be uploaded as artifacts.
