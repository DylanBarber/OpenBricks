name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: compute
          load: true
          tags: openbricks-compute:test
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=compute
          cache-to: type=gha,mode=max,scope=compute
      - name: Backend and real Spark/Delta checks
        run: docker run --rm --memory=4g --memory-swap=4g -e SPARK_MASTER=local[2] -e SPARK_DRIVER_MEMORY=1g -e OPENBRICKS_TEST_SPARK=1 openbricks-compute:test python -m pytest -q tests
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  sqlserver:
    name: SQL Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: compute
          load: true
          tags: openbricks-compute:test
          build-args: OPENBRICKS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=compute
          cache-to: type=gha,mode=max,scope=compute-sql
      - name: Configure disposable SQL Server credential
        run: |
          test_password="Sql$(openssl rand -hex 20)!"
          echo "::add-mask::$test_password"
          echo "OPENBRICKS_SQLSERVER_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - name: Real ODBC, JDBC, and change-tracking checks
        run: docker compose -f compose.sql-tests.yaml up --abort-on-container-exit --exit-code-from tests --no-build
      - name: Remove disposable SQL Server resources
        if: always()
        env:
          OPENBRICKS_SQLSERVER_PASSWORD: cleanup-only-unused-password
        run: docker compose -f compose.sql-tests.yaml down --volumes --remove-orphans
  cli:
    name: CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./cli build
      - run: openbricks --version
      - name: Pack the example project without a server
        run: openbricks pack examples/deployable-project/openbricks.yml --output /tmp/openbricks-example.json
      - run: python -m build --wheel cli
