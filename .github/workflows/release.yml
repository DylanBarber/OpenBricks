name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: openbricks
          - target: compute
            image: openbricks-compute
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Image identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.identity.outputs.owner }}/${{ matrix.image }}:${{ steps.identity.outputs.version }}
          build-args: |
            OPENBRICKS_BUILD_ID=${{ github.sha }}
            OPENBRICKS_VERSION=${{ steps.identity.outputs.version }}
          cache-from: |
            type=gha,scope=compute
            type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Export portable Docker image
        env:
          IMAGE: ghcr.io/${{ steps.identity.outputs.owner }}/${{ matrix.image }}:${{ steps.identity.outputs.version }}
          ARCHIVE: openbricks-${{ steps.identity.outputs.version }}-${{ matrix.target }}-linux-amd64.tar.gz
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > "$ARCHIVE"
          test "$(stat -c %s "$ARCHIVE")" -lt 2000000000
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.target }}
          path: |
            openbricks-*.tar.gz
            openbricks-*.tar.gz.sha256
          compression-level: 0
          retention-days: 3
  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable CLI wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir cli-dist cli
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          merge-multiple: true
          path: images
      - name: Create release with deployment assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          bundle="openbricks-${GITHUB_REF_NAME#v}-deployment.tar.gz"
          tar -czf "$bundle" compose.release.yaml compose.compute.yaml compose.sql-tests.yaml .env.example docker/catalog DEPLOYMENT.md SECURITY.md LICENSE docs examples
          gh release create "$GITHUB_REF_NAME" "$bundle" images/*.tar.gz images/*.sha256 cli-dist/*.whl compose.release.yaml compose.compute.yaml .env.example --verify-tag --title "OpenBricks ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" "${release_flags[@]}"
