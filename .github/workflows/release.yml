name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: openbricks
          - target: compute
            image: openbricks-compute
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Image identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Configure registry publication
        id: publication
        shell: bash
        env:
          OWNER: ${{ steps.identity.outputs.owner }}
          VERSION: ${{ steps.identity.outputs.version }}
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERHUB_ENABLED: ${{ vars.DOCKERHUB_ENABLED }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          ghcr_tag="ghcr.io/${OWNER}/${IMAGE_NAME}:${VERSION}"
          hub_tag=""
          case "$DOCKERHUB_ENABLED" in
            true)
              if [[ -z "$DOCKERHUB_NAMESPACE" || -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
                echo "::error::Docker Hub publishing is enabled; configure DOCKERHUB_NAMESPACE, DOCKERHUB_USERNAME and the DOCKERHUB_TOKEN secret."
                exit 1
              fi
              if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
                echo "::error::DOCKERHUB_NAMESPACE must be a lowercase Docker Hub namespace without a registry, slash or whitespace."
                exit 1
              fi
              hub_tag="docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:${VERSION}"
              echo "Docker Hub requested: \`${hub_tag}\`. Both registries must publish successfully." >> "$GITHUB_STEP_SUMMARY"
              ;;
            ""|false)
              echo "Docker Hub skipped: DOCKERHUB_ENABLED is unset or false. This release publishes to GHCR only." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::DOCKERHUB_ENABLED must be true, false or unset."
              exit 1
              ;;
          esac
          {
            echo "tags<<OPENBRICKS_REGISTRY_TAGS"
            echo "$ghcr_tag"
            if [[ -n "$hub_tag" ]]; then echo "$hub_tag"; fi
            echo "OPENBRICKS_REGISTRY_TAGS"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED:-false}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: steps.publication.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.publication.outputs.tags }}
          build-args: |
            OPENBRICKS_BUILD_ID=${{ github.sha }}
            OPENBRICKS_VERSION=${{ steps.identity.outputs.version }}
          cache-from: |
            type=gha,scope=compute
            type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Report published registries
        shell: bash
        env:
          TAGS: ${{ steps.publication.outputs.tags }}
        run: |
          printf 'Published versioned image tags:\n\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do printf -- '- `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"; done <<< "$TAGS"
      - name: Export portable Docker image
        env:
          IMAGE: ghcr.io/${{ steps.identity.outputs.owner }}/${{ matrix.image }}:${{ steps.identity.outputs.version }}
          ARCHIVE: openbricks-${{ steps.identity.outputs.version }}-${{ matrix.target }}-linux-amd64.tar.gz
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > "$ARCHIVE"
          test "$(stat -c %s "$ARCHIVE")" -lt 2000000000
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.target }}
          path: |
            openbricks-*.tar.gz
            openbricks-*.tar.gz.sha256
          compression-level: 0
          retention-days: 3
  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable CLI wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir cli-dist cli
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          merge-multiple: true
          path: images
      - name: Create release with deployment assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          bundle="openbricks-${GITHUB_REF_NAME#v}-deployment.tar.gz"
          tar -czf "$bundle" compose.release.yaml compose.compute.yaml compose.sql-tests.yaml .env.example docker/catalog DEPLOYMENT.md SECURITY.md LICENSE docs examples
          gh release create "$GITHUB_REF_NAME" "$bundle" images/*.tar.gz images/*.sha256 cli-dist/*.whl compose.release.yaml compose.compute.yaml .env.example --verify-tag --title "OpenBricks ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" "${release_flags[@]}"
