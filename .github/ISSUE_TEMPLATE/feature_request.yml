name: Feature request
description: Explain a workflow OpenBricks could support better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the user's task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the experience and any important examples or constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or tradeoffs
      description: Include relevant workarounds, resource costs, or compatibility concerns.
