name: Bug report
description: Report a reproducible problem in OpenBricks.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use SECURITY.md. Remove credentials, private notebook code, and real data from this report."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the action, expected behavior, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or minimal example
      description: Include a small example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/revision, host OS, Docker version, enabled services, and relevant compute settings.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private information before attaching evidence.
